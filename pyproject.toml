[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-comment-cleaner"
version = "0.1.0"
description = "通过 Android ADB 自动化批量删除自己在抖音发出的评论"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cloudinstone" }]
keywords = ["douyin", "tiktok", "adb", "android", "automation", "privacy", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cloudinstone/douyin-comment-cleaner"
Issues = "https://github.com/cloudinstone/douyin-comment-cleaner/issues"

[project.scripts]
douyin-comment-cleaner = "douyin_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
