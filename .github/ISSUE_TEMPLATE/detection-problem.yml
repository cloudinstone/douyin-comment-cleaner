name: Detection problem
description: The tool fails to find comments, the delete menu, or a dialog
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 7 Pro, Android 17
    validations:
      required: true
  - type: input
    id: douyin
    attributes:
      label: Douyin version
      placeholder: "40.4.0"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output of `status` and `inspect`
      render: text
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        If you attach a UI dump (`inspect --save-xml dump.xml`), remove nicknames and comment text first.
